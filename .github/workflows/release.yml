name: release

# A release is the merge of its version bump: devkit's release.yml tags package.json's version on main when it has no
# v<version> tag yet and publishes the GitHub release from the CHANGELOG section. Nobody pushes a tag by hand, and a
# session that cannot push tags can still release by merging. Run it by hand (Actions > release > Run workflow) to
# release a version that merged without a tag. Sites pin the tag, and the bump job starts Renovate in each of them.

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: DrDustinEdwards/devkit/.github/workflows/release.yml@454002f526e5e8e645a9c110605880e220b611a0 # v0.21.0

  # A tag made with the workflow's own token starts no other workflow, so the consumer bumps start from here.
  bump:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: DrDustinEdwards/devkit/.github/workflows/bump-consumers.yml@454002f526e5e8e645a9c110605880e220b611a0 # v0.21.0
    secrets:
      token: ${{ secrets.RENOVATE_TRIGGER_TOKEN }}
