name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The diagrams are committed drawings; nothing here draws one, so Puppeteer's Chromium is not fetched.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Typecheck the modules, their declarations and the tests
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # pr.yml installs nothing here (checks.yml, node: false), so the specimen's var() check runs in this job.
      - name: Every var() in the specimen's CSS is declared
        run: npx devkit-css-vars
      - name: Format check
        run: npm run format:check
      - name: The sites' published output, reproduced byte for byte
        run: npm test
      - name: devkit's no-bloat ratchet against .no-bloat.json
        run: npm run bloat

  # The specimen at https://prelum.dustinedwards.info, through devkit's shared deploy (worker-deploy.yml), as on the D1
  # sites: once the checks pass it builds the specimen, deploys with DEPLOY_SHA set to this commit, waits for /health
  # (site-runtime's staticSite) to report it, checks the home page answers, and rolls the deploy back if it does not.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@90efbee8e78a1b07b334d5058d19cb0e2a9828d0 # v0.48.0
    with:
      worker-name: prelum
      health-url: https://prelum.dustinedwards.info/health
      verify-command: node "$DEVKIT_DIR/bin/verify-deploy.mjs" https://prelum.dustinedwards.info
      install: PUPPETEER_SKIP_DOWNLOAD=true npm ci
      pre-deploy: npm run specimen
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Prelum's own prelum-indexnow with the built sitemap and the key in specimen/build.mjs, once the live gate passes. A
  # refused ping is a warning, never a failed deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # indexnow.mjs imports @dustinedwards/site-runtime/encoding, so the dependencies must be installed.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Tell IndexNow
        run: |
          key=$(sed -n 's/^const INDEXNOW_KEY = "\(.*\)";$/\1/p' specimen/build.mjs)
          curl -sf https://prelum.dustinedwards.info/sitemap.xml -o "$RUNNER_TEMP/sitemap.xml"
          node bin/indexnow.mjs --origin https://prelum.dustinedwards.info --key "$key" --sitemap "$RUNNER_TEMP/sitemap.xml"
