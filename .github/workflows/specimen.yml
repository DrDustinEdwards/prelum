name: Deploy specimen

# Publishes the specimen to https://prelum.dustinedwards.info when main changes, as Enarratio's gallery deploys. It needs two
# repository secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them it says so and stops, rather than failing every
# push to main. The tests run first, so a red main is not deployed, and only the deploy step sees the token: npm ci runs
# dependencies' install scripts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specimen-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for Cloudflare credentials
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Specimen not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the specimen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - if: steps.secrets.outputs.ready == 'true'
        run: npm test
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy:specimen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Prelum's own prelum-indexnow with the built sitemap and the key in specimen/build.mjs. A refused ping is a warning,
      # never a failed deploy.
      - if: steps.secrets.outputs.ready == 'true'
        name: Tell IndexNow
        run: |
          key=$(sed -n 's/^const INDEXNOW_KEY = "\(.*\)";$/\1/p' specimen/build.mjs)
          node bin/indexnow.mjs --origin https://prelum.dustinedwards.info --key "$key" --sitemap specimen/dist/sitemap.xml
