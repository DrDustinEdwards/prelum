name: checks

# Every pull request check in one job: devkit's pr.yml runs the footer strip, the trailer check, the shared-code check,
# OSV-Scanner, actionlint and zizmor when .github/ changes, and the reviewer (devkit README, "One job per pull request").
# Exceptions to the shared-code check are in .shared.json with their reasons. What is shared:
# https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
# Run it by hand once to clean the footer from every past pull request.
#
# No push to main: the merge was checked as a pull request (devkit README, "No second run on main"). The job id is
# `checks`, so the check is "checks / Repo checks", the name the ruleset requires.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@562daa2dbfb23f2987f81caeac34f9e054b3d03b # v0.26.4
    with:
      review: true
      # No install here: Prelum's no-bloat report is a warning in ci.yml's check job (npm run bloat), and the specimen's
      # Worker has no bundle budget, so pr.yml runs neither no-bloat nor worker-size.
      node: false
